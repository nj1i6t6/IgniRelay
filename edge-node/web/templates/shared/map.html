{{ define "content" }}
<div>
  <div class="page-header">
    <h2 class="page-title">離線地圖</h2>
    <div class="badge badge-done">PMTiles 離線</div>
  </div>

  <!-- 地圖佔位區 -->
  <div style="width: 100%; height: 55vh; background: var(--bg-card); border: 1px solid var(--border-default); border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-md);">
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.3;"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
    <div style="text-align: center;">
      <div style="color: var(--text-secondary); font-size: var(--text-base);">地圖載入區域</div>
      <div style="color: var(--text-muted); font-size: var(--text-sm); margin-top: var(--space-xs);">整合 Leaflet + PMTiles 後顯示轄區圖資</div>
    </div>
  </div>

  <!-- 圖層控制 -->
  <div class="mt-xl">
    <div class="section-header">
      <div class="section-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></svg>
        圖層控制
      </div>
    </div>
    <div class="card-list">
      <label class="card-item" style="cursor: pointer;">
        <input type="checkbox" checked style="accent-color: var(--accent-primary); width: 18px; height: 18px;">
        <div class="card-body">
          <div class="card-title">避難所 / 里節點</div>
          <div class="card-subtitle">標記所有節點位置</div>
        </div>
      </label>
      <label class="card-item" style="cursor: pointer;">
        <input type="checkbox" checked style="accent-color: var(--alert-critical); width: 18px; height: 18px;">
        <div class="card-body">
          <div class="card-title">SOS 求救事件</div>
          <div class="card-subtitle">紅色閃爍標記</div>
        </div>
      </label>
      <label class="card-item" style="cursor: pointer;">
        <input type="checkbox" checked style="accent-color: var(--alert-hazard); width: 18px; height: 18px;">
        <div class="card-body">
          <div class="card-title">危害回報</div>
          <div class="card-subtitle">道路中斷、建物危險等</div>
        </div>
      </label>
    </div>
  </div>
</div>
{{ end }}
