{{ define "content" }}
<div>
  <div class="page-header">
    <h2 class="page-title">下轄避難所總覽</h2>
    <div class="badge badge-active">即時更新中</div>
  </div>

  <div class="card-list">
    <!-- Shelter 1: Online, healthy -->
    <a href="/shelters/SHLT-XINYI-001" class="card-item" style="text-decoration: none;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 48px;">
        <div class="status-dot online" style="width: 10px; height: 10px;"></div>
        <span class="text-sm" style="color: var(--status-online);">在線</span>
      </div>
      <div class="card-body">
        <div class="card-title">信義國小避難所</div>
        <div class="card-subtitle">同步: 2 分鐘前</div>
        <div class="flex gap-md mt-md" style="flex-wrap: wrap;">
          <span class="text-sm" style="color: var(--text-secondary);">收容 <strong class="text-mono" style="color: var(--text-primary);">142</strong> 人</span>
          <span class="text-sm" style="color: var(--text-secondary);">物資 <strong class="text-mono" style="color: var(--alert-safe);">充足</strong></span>
          <span class="text-sm" style="color: var(--text-secondary);">SOS <strong class="text-mono" style="color: var(--alert-critical);">1</strong></span>
        </div>
      </div>
      <div class="card-right">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>

    <!-- Shelter 2: Online, warning -->
    <a href="/shelters/SHLT-XINYI-002" class="card-item" style="text-decoration: none;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 48px;">
        <div class="status-dot online" style="width: 10px; height: 10px;"></div>
        <span class="text-sm" style="color: var(--status-online);">在線</span>
      </div>
      <div class="card-body">
        <div class="card-title">信義運動中心</div>
        <div class="card-subtitle">同步: 5 分鐘前</div>
        <div class="flex gap-md mt-md" style="flex-wrap: wrap;">
          <span class="text-sm" style="color: var(--text-secondary);">收容 <strong class="text-mono" style="color: var(--text-primary);">87</strong> 人</span>
          <span class="text-sm" style="color: var(--text-secondary);">物資 <strong class="text-mono" style="color: var(--alert-warning);">不足</strong></span>
          <span class="text-sm" style="color: var(--text-secondary);">SOS <strong class="text-mono" style="color: var(--text-muted);">0</strong></span>
        </div>
      </div>
      <div class="card-right">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>

    <!-- Shelter 3: Offline -->
    <a href="/shelters/SHLT-XINYI-003" class="card-item" style="text-decoration: none; opacity: 0.65;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 48px;">
        <div class="status-dot offline" style="width: 10px; height: 10px;"></div>
        <span class="text-sm" style="color: var(--status-offline);">離線</span>
      </div>
      <div class="card-body">
        <div class="card-title">三張犁活動中心</div>
        <div class="card-subtitle" style="color: var(--alert-warning);">失聯: 2 小時 15 分鐘</div>
        <div class="flex gap-md mt-md" style="flex-wrap: wrap;">
          <span class="text-sm" style="color: var(--text-muted);">收容 <strong class="text-mono">--</strong> 人</span>
          <span class="text-sm" style="color: var(--text-muted);">物資 <strong class="text-mono">未知</strong></span>
        </div>
      </div>
      <div class="card-right">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </a>
  </div>
</div>
{{ end }}
