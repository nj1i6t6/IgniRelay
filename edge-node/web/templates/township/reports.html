{{ define "content" }}
<div>
  <div class="page-header">
    <h2 class="page-title">統計報表</h2>
    <div class="badge badge-active">每小時更新</div>
  </div>

  <!-- 收容人數趨勢 (CSS bar chart) -->
  <div class="section-header">
    <div class="section-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      收容人數趨勢 (過去 8 小時)
    </div>
  </div>

  <div style="background: var(--bg-card); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: var(--space-lg);">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-sm); height: 160px;">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span class="text-mono text-sm" style="color: var(--text-secondary);">980</span>
        <div style="width: 100%; background: var(--accent-primary); border-radius: 2px 2px 0 0; height: 55%; opacity: 0.6;"></div>
        <span class="text-sm" style="color: var(--text-muted);">02</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span class="text-mono text-sm" style="color: var(--text-secondary);">1020</span>
        <div style="width: 100%; background: var(--accent-primary); border-radius: 2px 2px 0 0; height: 60%; opacity: 0.65;"></div>
        <span class="text-sm" style="color: var(--text-muted);">03</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span class="text-mono text-sm" style="color: var(--text-secondary);">1080</span>
        <div style="width: 100%; background: var(--accent-primary); border-radius: 2px 2px 0 0; height: 67%; opacity: 0.7;"></div>
        <span class="text-sm" style="color: var(--text-muted);">04</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span class="text-mono text-sm" style="color: var(--text-secondary);">1150</span>
        <div style="width: 100%; background: var(--accent-primary); border-radius: 2px 2px 0 0; height: 72%; opacity: 0.75;"></div>
        <span class="text-sm" style="color: var(--text-muted);">05</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span class="text-mono text-sm" style="color: var(--text-secondary);">1250</span>
        <div style="width: 100%; background: var(--accent-primary); border-radius: 2px 2px 0 0; height: 80%; opacity: 0.8;"></div>
        <span class="text-sm" style="color: var(--text-muted);">06</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span class="text-mono text-sm" style="color: var(--text-secondary);">1340</span>
        <div style="width: 100%; background: var(--accent-primary); border-radius: 2px 2px 0 0; height: 87%; opacity: 0.85;"></div>
        <span class="text-sm" style="color: var(--text-muted);">07</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span class="text-mono text-sm" style="color: var(--text-secondary);">1380</span>
        <div style="width: 100%; background: var(--accent-primary); border-radius: 2px 2px 0 0; height: 90%; opacity: 0.9;"></div>
        <span class="text-sm" style="color: var(--text-muted);">08</span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span class="text-mono text-sm" style="color: var(--text-primary); font-weight: 600;">1423</span>
        <div style="width: 100%; background: var(--accent-primary); border-radius: 2px 2px 0 0; height: 95%;"></div>
        <span class="text-sm" style="color: var(--text-primary); font-weight: 500;">09</span>
      </div>
    </div>
  </div>

  <!-- SOS 分類 -->
  <div class="section-header mt-xl">
    <div class="section-title">SOS 事件分類統計</div>
  </div>

  <div class="card-list">
    <div class="card-item">
      <div class="card-icon" style="background: rgba(220,38,38,0.15);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">SOS_RED (生命危害)</div>
        <div class="stock-bar mt-md"><div class="stock-bar-fill low" style="width: 60%;"></div></div>
      </div>
      <div class="card-right">
        <div class="card-value" style="color: var(--alert-critical);">3</div>
      </div>
    </div>
    <div class="card-item">
      <div class="card-icon" style="background: rgba(217,119,6,0.15);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">SOS_YELLOW (緊急)</div>
        <div class="stock-bar mt-md"><div class="stock-bar-fill medium" style="width: 40%;"></div></div>
      </div>
      <div class="card-right">
        <div class="card-value" style="color: var(--alert-warning);">2</div>
      </div>
    </div>
    <div class="card-item">
      <div class="card-icon" style="background: rgba(37,99,235,0.15);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">RESOURCE (物資需求)</div>
        <div class="stock-bar mt-md"><div class="stock-bar-fill high" style="width: 80%;"></div></div>
      </div>
      <div class="card-right">
        <div class="card-value" style="color: var(--alert-info);">8</div>
      </div>
    </div>
  </div>

  <button class="btn btn-secondary btn-block mt-xl">匯出報表 (CSV)</button>
</div>
{{ end }}
