{{ define "content" }}
<div>
  <!-- EOC Dashboard -->
  <div class="stat-grid" style="grid-template-columns: repeat(5, 1fr);">
    <div class="stat-card">
      <div class="stat-label">總收容</div>
      <div class="stat-value">1,423</div>
      <div class="stat-trend up">▲ +89 今日</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">避難所</div>
      <div class="stat-value">18</div>
      <div class="stat-trend system">16 在線</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">SOS 待處</div>
      <div class="stat-value sos-active">5</div>
      <div class="stat-trend down">需立即回應</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">下轄里</div>
      <div class="stat-value">12</div>
      <div class="stat-trend system">全部在線</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">離線節點</div>
      <div class="stat-value" style="color: var(--alert-warning);">2</div>
      <div class="stat-trend down">超過 1h</div>
    </div>
  </div>

  <!-- 下轄里彙總表 -->
  <div class="section-header mt-xl">
    <div class="section-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/></svg>
      下轄里彙總
    </div>
  </div>

  <!-- 表格式列表 -->
  <div style="overflow-x: auto;">
    <table style="width: 100%; border-collapse: collapse; font-size: var(--text-sm);">
      <thead>
        <tr style="border-bottom: 1px solid var(--border-default);">
          <th style="text-align: left; padding: var(--space-md); color: var(--text-muted); font-weight: 500;">里名</th>
          <th style="text-align: center; padding: var(--space-md); color: var(--text-muted); font-weight: 500;">避難所</th>
          <th style="text-align: center; padding: var(--space-md); color: var(--text-muted); font-weight: 500;">收容</th>
          <th style="text-align: center; padding: var(--space-md); color: var(--text-muted); font-weight: 500;">SOS</th>
          <th style="text-align: center; padding: var(--space-md); color: var(--text-muted); font-weight: 500;">物資</th>
          <th style="text-align: center; padding: var(--space-md); color: var(--text-muted); font-weight: 500;">狀態</th>
        </tr>
      </thead>
      <tbody>
        <tr style="border-bottom: 1px solid var(--border-default); cursor: pointer;" onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='transparent'">
          <td style="padding: var(--space-md); color: var(--text-primary);">信義里</td>
          <td style="text-align: center; padding: var(--space-md); font-family: var(--font-mono);">3</td>
          <td style="text-align: center; padding: var(--space-md); font-family: var(--font-mono); color: var(--text-primary);">229</td>
          <td style="text-align: center; padding: var(--space-md); font-family: var(--font-mono); color: var(--alert-critical);">2</td>
          <td style="text-align: center; padding: var(--space-md);"><span class="badge badge-pending">不足</span></td>
          <td style="text-align: center; padding: var(--space-md);"><div class="status-dot online" style="margin: 0 auto;"></div></td>
        </tr>
        <tr style="border-bottom: 1px solid var(--border-default); cursor: pointer;" onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='transparent'">
          <td style="padding: var(--space-md); color: var(--text-primary);">永吉里</td>
          <td style="text-align: center; padding: var(--space-md); font-family: var(--font-mono);">2</td>
          <td style="text-align: center; padding: var(--space-md); font-family: var(--font-mono); color: var(--text-primary);">156</td>
          <td style="text-align: center; padding: var(--space-md); font-family: var(--font-mono); color: var(--text-muted);">0</td>
          <td style="text-align: center; padding: var(--space-md);"><span class="badge badge-done">充足</span></td>
          <td style="text-align: center; padding: var(--space-md);"><div class="status-dot online" style="margin: 0 auto;"></div></td>
        </tr>
        <tr style="border-bottom: 1px solid var(--border-default); cursor: pointer;" onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='transparent'">
          <td style="padding: var(--space-md); color: var(--text-primary);">松仁里</td>
          <td style="text-align: center; padding: var(--space-md); font-family: var(--font-mono);">1</td>
          <td style="text-align: center; padding: var(--space-md); font-family: var(--font-mono); color: var(--text-primary);">45</td>
          <td style="text-align: center; padding: var(--space-md); font-family: var(--font-mono); color: var(--alert-warning);">1</td>
          <td style="text-align: center; padding: var(--space-md);"><span class="badge badge-pending">不足</span></td>
          <td style="text-align: center; padding: var(--space-md);"><div class="status-dot online" style="margin: 0 auto;"></div></td>
        </tr>
        <tr style="border-bottom: 1px solid var(--border-default); cursor: pointer; opacity: 0.6;" onmouseover="this.style.background='var(--bg-card)'" onmouseout="this.style.background='transparent'">
          <td style="padding: var(--space-md); color: var(--text-muted);">三張犁</td>
          <td style="text-align: center; padding: var(--space-md); font-family: var(--font-mono);">2</td>
          <td style="text-align: center; padding: var(--space-md); font-family: var(--font-mono); color: var(--text-muted);">--</td>
          <td style="text-align: center; padding: var(--space-md); font-family: var(--font-mono); color: var(--text-muted);">--</td>
          <td style="text-align: center; padding: var(--space-md);"><span class="badge badge-offline">未知</span></td>
          <td style="text-align: center; padding: var(--space-md);"><div class="status-dot offline" style="margin: 0 auto;"></div></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 警報區 -->
  <div class="section-header mt-xl">
    <div class="section-title" style="color: var(--alert-critical);">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--alert-critical)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      即時警報
    </div>
  </div>

  <div class="card-list">
    <div class="card-item sos-active">
      <div class="card-body">
        <div class="flex items-center gap-sm">
          <span class="badge badge-critical">SOS RED</span>
          <span style="color: var(--text-primary); font-weight: 500;">信義里 — 大安路房屋倒塌</span>
        </div>
        <div class="text-sm mt-md" style="color: var(--text-muted);">09:35 回報 | 已轉派警消單位</div>
      </div>
    </div>
    <div class="card-item" style="border-left: 3px solid var(--alert-warning);">
      <div class="card-body">
        <div class="flex items-center gap-sm">
          <span class="badge badge-pending">RESOURCE</span>
          <span style="color: var(--text-primary); font-weight: 500;">松仁里 — 醫療物資短缺</span>
        </div>
        <div class="text-sm mt-md" style="color: var(--text-muted);">09:28 回報 | 等候調度</div>
      </div>
    </div>
  </div>

  <!-- 快捷操作 -->
  <div class="action-grid mt-xl">
    <a href="/dispatch" class="action-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      發布調度指令
    </a>
    <a href="/map" class="action-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
      開啟戰情地圖
    </a>
  </div>
</div>
{{ end }}
