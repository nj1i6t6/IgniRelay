{{ define "content" }}
<div>
  <div class="page-header">
    <h2 class="page-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px;"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      全區調度指令
    </h2>
  </div>

  <div class="card-item" style="background: var(--bg-secondary); flex-direction: column; align-items: stretch; margin-bottom: var(--space-xl);">
    <h3 style="font-size: var(--text-base); margin-bottom: var(--space-md);">發布新指令</h3>
    <div class="form-group">
      <label class="form-label">目標範圍 <span class="required">*</span></label>
      <select class="form-select">
        <option>全區廣播 (所有里與避難所)</option>
        <option>指定里辦公處</option>
        <option>僅警消單位群組</option>
      </select>
    </div>
    
    <div class="form-group">
      <label class="form-label">指令內容 <span class="required">*</span></label>
      <textarea class="form-textarea" placeholder="請輸入調度或通報內容..."></textarea>
    </div>

    <button class="btn btn-danger btn-block">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      立即發送
    </button>
  </div>

  <div class="section-header">
    <div class="section-title">已下達指令歷史</div>
  </div>

  <div class="card-list">
    <div class="card-item">
      <div class="card-body">
        <div class="card-title text-primary">防範午後豪雨，請各所加固帳篷</div>
        <div class="card-subtitle mt-xs">全區廣播 • 今天 08:30</div>
      </div>
      <div class="card-right">
        <div class="badge badge-done">已送達 12/12</div>
      </div>
    </div>
  </div>
</div>
{{ end }}
