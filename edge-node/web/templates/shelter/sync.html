{{ define "content" }}
<div>
  <div class="page-header">
    <h2 class="page-title">資料同步</h2>
  </div>

  <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr);">
    <div class="stat-card">
      <div class="stat-label">同步狀態</div>
      <div class="stat-value" style="font-size: var(--text-stat-sm); color: var(--status-online);">正常</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">待上傳</div>
      <div class="stat-value" style="font-size: var(--text-stat-sm);">3</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">上級節點</div>
      <div class="stat-value" style="font-size: var(--text-stat-sm); color: var(--accent-primary);">信義里</div>
    </div>
  </div>

  <div class="section-header mt-xl">
    <div class="section-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
      傳輸管道
    </div>
  </div>

  <div class="card-list">
    <div class="card-item">
      <div class="status-dot online" style="width: 10px; height: 10px;"></div>
      <div class="card-body">
        <div class="card-title">BLE Mesh</div>
        <div class="card-subtitle">主要通道 | 連線至里節點 | 延遲 ~2s</div>
      </div>
      <div class="card-right"><div class="badge badge-done">啟用</div></div>
    </div>
    <div class="card-item">
      <div class="status-dot offline" style="width: 10px; height: 10px;"></div>
      <div class="card-body">
        <div class="card-title">WiFi / HTTP</div>
        <div class="card-subtitle">未偵測到里級 WiFi AP</div>
      </div>
      <div class="card-right"><div class="badge badge-offline">不可用</div></div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section-header">
    <div class="section-title">同步歷史</div>
  </div>

  <ul class="timeline">
    <li class="timeline-item">
      <div class="timeline-dot safe"></div>
      <div class="timeline-time">09:00</div>
      <div class="timeline-content">
        <div class="text-primary">上報至信義里成功</div>
        <div class="text-sm text-muted">BLE Mesh | 6 筆事件 | 耗時 2.1s</div>
      </div>
    </li>
    <li class="timeline-item">
      <div class="timeline-dot safe"></div>
      <div class="timeline-time">08:00</div>
      <div class="timeline-content">
        <div class="text-primary">接收里調度指令</div>
        <div class="text-sm text-muted">BLE Mesh | 1 筆指令</div>
      </div>
    </li>
    <li class="timeline-item">
      <div class="timeline-dot warning"></div>
      <div class="timeline-time">07:15</div>
      <div class="timeline-content">
        <div class="text-primary">上報逾時，已排入佇列</div>
        <div class="text-sm text-muted">將於下次心跳重試</div>
      </div>
    </li>
  </ul>

  <button class="btn btn-primary btn-block mt-xl">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
    立即同步至里節點
  </button>
</div>
{{ end }}
