{{ define "content" }}
<div>
  <div class="page-header">
    <h2 class="page-title">節點設定</h2>
  </div>

  <!-- 節點資訊 -->
  <div class="section-header">
    <div class="section-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m-7-7h6m6 0h6"/></svg>
      節點資訊
    </div>
  </div>

  <div class="card-item" style="flex-direction: column; align-items: stretch; gap: var(--space-md);">
    <div class="flex justify-between items-center">
      <span class="text-sm" style="color: var(--text-muted);">節點名稱</span>
      <span style="color: var(--text-primary);">信義國小避難所</span>
    </div>
    <div class="flex justify-between items-center">
      <span class="text-sm" style="color: var(--text-muted);">節點 ID</span>
      <span class="text-mono text-sm" style="color: var(--text-secondary);">SHLT-XINYI-001</span>
    </div>
    <div class="flex justify-between items-center">
      <span class="text-sm" style="color: var(--text-muted);">角色</span>
      <span class="badge badge-done">避難所</span>
    </div>
    <div class="flex justify-between items-center">
      <span class="text-sm" style="color: var(--text-muted);">上級節點</span>
      <span style="color: var(--text-secondary);">信義里辦公處</span>
    </div>
    <div class="flex justify-between items-center">
      <span class="text-sm" style="color: var(--text-muted);">系統版本</span>
      <span class="text-mono text-sm" style="color: var(--text-muted);">v0.1.0-alpha</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- 同步狀態 -->
  <div class="section-header">
    <div class="section-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21v-5h5"/></svg>
      同步狀態
    </div>
  </div>

  <div class="card-item" style="flex-direction: column; align-items: stretch; gap: var(--space-md);">
    <div class="flex justify-between items-center">
      <span class="text-sm" style="color: var(--text-muted);">連線方式</span>
      <span class="badge badge-done">BLE Mesh</span>
    </div>
    <div class="flex justify-between items-center">
      <span class="text-sm" style="color: var(--text-muted);">最後同步</span>
      <span class="text-mono text-sm" style="color: var(--text-secondary);">2026-04-08 09:00:12</span>
    </div>
    <div class="flex justify-between items-center">
      <span class="text-sm" style="color: var(--text-muted);">待上傳事件</span>
      <span class="text-mono" style="color: var(--alert-warning);">3</span>
    </div>
    <button class="btn btn-primary btn-block mt-md">立即同步至里節點</button>
  </div>

  <div class="divider"></div>

  <!-- WiFi 與網路 -->
  <div class="section-header">
    <div class="section-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
      WiFi 熱點設定
    </div>
  </div>

  <div class="card-item" style="flex-direction: column; align-items: stretch; gap: var(--space-md);">
    <div class="form-group" style="margin-bottom: 0;">
      <label class="form-label">SSID (熱點名稱)</label>
      <input type="text" class="form-input" value="ResQMesh-XINYI-001" readonly>
    </div>
    <div class="form-group" style="margin-bottom: 0;">
      <label class="form-label">密碼</label>
      <input type="password" class="form-input" value="resqmesh2026">
    </div>
    <div class="flex justify-between items-center">
      <span class="text-sm" style="color: var(--text-muted);">目前連線裝置</span>
      <span class="text-mono" style="color: var(--accent-primary);">7 台</span>
    </div>
  </div>

  <div class="divider"></div>

  <!-- 系統操作 -->
  <div class="section-header">
    <div class="section-title">系統操作</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: var(--space-md);">
    <button class="btn btn-secondary btn-block">匯出節點資料 (JSON)</button>
    <button class="btn btn-danger btn-block">重啟節點服務</button>
  </div>
</div>
{{ end }}
