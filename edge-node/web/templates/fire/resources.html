{{ define "content" }}
<div>
  <div class="page-header">
    <h2 class="page-title">可用資源總覽</h2>
  </div>

  <!-- 人力 -->
  <div class="section-header">
    <div class="section-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      人員配置
    </div>
  </div>

  <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr);">
    <div class="stat-card">
      <div class="stat-label">值勤人員</div>
      <div class="stat-value" style="color: var(--status-online);">12</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">出勤中</div>
      <div class="stat-value" style="color: var(--alert-warning);">4</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">待命中</div>
      <div class="stat-value">8</div>
    </div>
  </div>

  <!-- 車輛 -->
  <div class="section-header mt-xl">
    <div class="section-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      車輛裝備
    </div>
  </div>

  <div class="card-list">
    <div class="card-item">
      <div class="card-icon" style="background: rgba(5,150,105,0.15);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">水箱車 01</div>
        <div class="card-subtitle">車牌: ABC-1234 | 水量: 80%</div>
      </div>
      <div class="card-right">
        <div class="badge badge-done">待命</div>
      </div>
    </div>

    <div class="card-item">
      <div class="card-icon" style="background: rgba(217,119,6,0.15);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">雲梯車 01</div>
        <div class="card-subtitle">車牌: DEF-5678 | 出勤中</div>
      </div>
      <div class="card-right">
        <div class="badge badge-pending">出勤</div>
      </div>
    </div>

    <div class="card-item">
      <div class="card-icon" style="background: rgba(5,150,105,0.15);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">救護車 01</div>
        <div class="card-subtitle">車牌: GHI-9012 | AED 就緒</div>
      </div>
      <div class="card-right">
        <div class="badge badge-done">待命</div>
      </div>
    </div>

    <div class="card-item">
      <div class="card-icon" style="background: rgba(5,150,105,0.15);">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">救護車 02</div>
        <div class="card-subtitle">車牌: JKL-3456 | AED 就緒</div>
      </div>
      <div class="card-right">
        <div class="badge badge-done">待命</div>
      </div>
    </div>
  </div>
</div>
{{ end }}
