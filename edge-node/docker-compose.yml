services:
  # ── Port 8081: 避難所 ──
  shelter:
    build: .
    container_name: resqmesh-shelter
    ports:
      - "8081:8080"
    volumes:
      - ./web:/app/web
    environment:
      - PORT=8080
      - ROLE=shelter
    restart: unless-stopped

  # ── Port 8082: 里 ──
  village:
    build: .
    container_name: resqmesh-village
    ports:
      - "8082:8080"
    volumes:
      - ./web:/app/web
    environment:
      - PORT=8080
      - ROLE=village
    restart: unless-stopped

  # ── Port 8083: 鄉鎮區 EOC ──
  township:
    build: .
    container_name: resqmesh-township
    ports:
      - "8083:8080"
    volumes:
      - ./web:/app/web
    environment:
      - PORT=8080
      - ROLE=township
    restart: unless-stopped

  # ── Port 8084: 警消 ──
  fire:
    build: .
    container_name: resqmesh-fire
    ports:
      - "8084:8080"
    volumes:
      - ./web:/app/web
    environment:
      - PORT=8080
      - ROLE=fire
    restart: unless-stopped
